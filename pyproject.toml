# Not a packaged distribution - the modules are run directly from the repo
# root. This file exists so pytest and ruff pick up consistent settings.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
markers = [
    "live_auth: run against the real login instead of a stood-in administrator",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
