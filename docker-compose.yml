services:
  qlikai:
    build: .
    image: qlikai:latest
    container_name: qlikai
    restart: unless-stopped

    env_file:
      - .env

    environment:
      USERS_DB: /data/users.db
      HISTORY_DIR: /data/history
      LOG_FILE: /var/log/qlikai/qlik-ai.log
      QLIK_CERT_DIR: /certs

      WORKER_THREADS: ${WORKER_THREADS:-128}

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - qlikai-data:/data
      - qlikai-logs:/var/log/qlikai

      - ./certs:/certs:ro

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  qlikai-data:
  qlikai-logs:
