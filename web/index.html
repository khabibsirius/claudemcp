<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qlik AI — Data Load Editor</title>
<script>
  // Resolve the theme before the first paint, or the page flashes the wrong
  // one on every load. The rest of the theme handling is in the main script;
  // this only has to run early.
  try {
    var saved = localStorage.getItem("qlikai-theme") || "system";
    document.documentElement.dataset.theme =
      saved === "dark" || (saved !== "light" &&
        matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  } catch (e) {}
</script>
<style>
  /* Self-contained on purpose: no external fonts or scripts - this has to
     work with no internet. System fonts only. */
  /* Light is the base; the dark palette below is applied by data-theme,
     which the head script sets from the saved choice or the OS. Driving it
     from an attribute rather than a media query is what lets someone pick a
     theme that isn't the one their machine is set to. */
  :root {
    color-scheme: light;
    --green: #00934c; --green-dark: #007a3f; --green-soft: #e6f5ec;
    --bg: #f4f6f8; --surface: #ffffff; --raised: #fbfcfd;
    --line: #e2e6ea; --line-soft: #edf0f3;
    --ink: #1f2733; --muted: #69737f; --faint: #97a0aa;
    --accent: #2f7fb2; --accent-soft: #e9f3f9;
    --bad: #c0392b; --bad-soft: #fcedeb;
    --chip: #f0f2f5; --you-bubble: #e6f5ec; --bot-bubble: #f2f4f7;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
    --code-bg: #fbfcfd; --gutter-bg: #f5f7f9;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --green: #1db26b; --green-dark: #17995b; --green-soft: #10281c;
    --bg: #14161a; --surface: #1c1f24; --raised: #22262c;
    --line: #30353d; --line-soft: #272b32;
    --ink: #e6e9ed; --muted: #e8e0e0; --faint: #6b747f;
    --accent: #5aa3cf; --accent-soft: #16232c;
    --bad: #cc0808; --bad-soft: #33201c;
    --chip: #262b32; --you-bubble: #123324; --bot-bubble: #242930;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --code-bg: #191c21; --gutter-bg: #1c2026;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column;
  }
  ::selection { background: var(--accent); color: #fff; }

  /* Subtle scrollbars that match both themes. */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: var(--line); border-radius: 8px;
    border: 2px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--faint); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ------------------------------------------------------------------ */
  /* Top bar                                                             */
  /* ------------------------------------------------------------------ */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; background: var(--surface);
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow); z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-right: 4px; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, var(--green) 0%, #06b6d4 120%);
    display: grid; place-items: center;
    color: #fff; font-size: 13px; font-weight: 700;
  }
  .brand .name { font-weight: 650; font-size: 14.5px; letter-spacing: .1px; }
  .brand .name span { color: var(--green); }
  .badge {
    font-size: 11px; font-weight: 600; color: var(--muted);
    background: var(--chip); border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 999px; text-transform: lowercase;
  }
  header .spacer { flex: 1; }

  /* Who is signed in, and the way out. Kept to the right of the primary
     actions so it never competes with Save and Load data. */
  .account { display: flex; align-items: center; gap: 8px; padding-left: 12px;
             margin-left: 4px; border-left: 1px solid var(--line); }
  .account .who {
    font-size: 12.5px; color: var(--muted); text-decoration: none;
    max-width: 180px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .account a.who { color: var(--accent); font-weight: 600; }
  .account a.who:hover { text-decoration: underline; }

  .acting {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; font-size: 12.5px;
    background: var(--bad-soft); color: var(--bad);
    border-bottom: 1px solid var(--bad);
  }
  .acting[hidden] { display: none; }

  /* Shown when the connection to Qlik has gone. Shares the acting bar's
     shape on purpose - it is the same kind of thing: a state the page is in
     that the person has to know about, with the one action that ends it. */
  .offline {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; font-size: 12.5px;
    background: var(--bad-soft); color: var(--bad);
    border-bottom: 1px solid var(--bad);
  }
  .offline[hidden] { display: none; }
  .offline span { flex: 1; }
  .offline button.busy { opacity: .6; pointer-events: none; }

  .pick { display: flex; flex-direction: column; gap: 1px; font-size: 10.5px;
          font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
          color: var(--faint); }
  .pick select {
    font: 13px "Segoe UI", system-ui, sans-serif; color: var(--ink);
    background: var(--raised); padding: 6px 26px 6px 9px;
    border: 1px solid var(--line); border-radius: 7px; max-width: 280px;
    appearance: none; cursor: pointer; outline: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%;
    background-size: 5px 5px;
    background-repeat: no-repeat;
    transition: border-color .15s;
  }
  .pick select:hover { border-color: var(--faint); }
  .pick select:focus { border-color: var(--accent); }
  .pick select option:disabled { color: var(--bad); }

  /* The reload permission, as a switch rather than a bare checkbox. */
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer;
            font-size: 12.5px; color: var(--muted); user-select: none; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track {
    width: 32px; height: 18px; border-radius: 999px; flex: none;
    background: var(--line); position: relative; transition: background .18s;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25);
    transition: transform .18s;
  }
  .switch input:checked + .track { background: var(--green); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Theme picker. Three states rather than two, because "follow the machine"
     is a real preference and losing it to a plain toggle is a downgrade. */
  .theme {
    display: flex; gap: 2px; padding: 2px; flex: none;
    background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
  }
  .theme button {
    font: 12px "Segoe UI", system-ui, sans-serif; line-height: 1;
    padding: 5px 9px; border: 0; border-radius: 999px;
    background: transparent; color: var(--muted); box-shadow: none;
  }
  .theme button:hover:not(.on) { background: var(--line-soft); color: var(--ink); }
  .theme button.on {
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }

  button {
    font: inherit; font-weight: 550; padding: 7px 16px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--raised); color: var(--ink);
    cursor: pointer; transition: background .15s, border-color .15s, transform .06s;
  }
  button:hover:not(:disabled) { background: var(--chip); border-color: var(--faint); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button.primary {
    background: var(--green); border-color: var(--green); color: #fff;
    box-shadow: var(--shadow);
  }
  button.primary:hover:not(:disabled) { background: var(--green-dark); border-color: var(--green-dark); }
  button:disabled { opacity: .55; cursor: not-allowed; }

  /* Send doubles as Stop while a turn streams. Red because it is the same
     button in the same place as the green Send, so colour is the only thing
     telling them apart at a glance. --bad already carries its own
     dark-theme value, and brightness() darkens the hover in both themes
     without a second variable to keep in step with it. */
  button.primary.stopping,
  button.primary.stopping:hover { background: var(--bad); border-color: var(--bad); }
  button.primary.stopping:hover { filter: brightness(.92); }

  /* Busy state for Load data: a small conic spinner replaces intent. */
  button .spin {
    display: none; width: 12px; height: 12px; margin-right: 7px;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    border-radius: 50%; vertical-align: -2px;
    animation: rotate .7s linear infinite;
  }
  button.busy .spin { display: inline-block; }
  @keyframes rotate { to { transform: rotate(360deg); } }

  /* ------------------------------------------------------------------ */
  /* Main three-pane layout                                              */
  /* ------------------------------------------------------------------ */
  main { flex: 1; display: flex; min-height: 0; gap: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .sections { width: var(--sections-w, 200px); background: var(--surface);
              border-right: 1px solid var(--line); overflow: hidden; flex: none; }
  .connections { width: var(--connections-w, 250px); background: var(--surface);
                 border-left: 1px solid var(--line); overflow: hidden; flex: none; }
  .editor { flex: 1; min-width: 0; background: var(--code-bg); }

  /* Draggable dividers. Every boundary in the layout can be taken hold of:
     the side panels collapse when dragged closed, and double-click puts a
     divider back where it started. */
  .divider-v { flex: none; width: 6px; margin: 0 -3px; cursor: col-resize;
               z-index: 4; transition: background .15s; }
  .divider-v:hover, .divider-v.dragging {
    background: color-mix(in srgb, var(--green) 45%, transparent);
  }
  .divider-h {
    position: absolute; top: 0; left: 0; right: 0; height: 8px;
    cursor: row-resize; z-index: 6;
  }
  .divider-h::after {
    content: ""; display: block; margin: 2px auto 0;
    width: 44px; height: 4px; border-radius: 99px; background: var(--line);
    transition: background .15s;
  }
  .divider-h:hover::after, .divider-h.dragging::after { background: var(--green); }

  .panel-title {
    padding: 11px 14px 9px; font-size: 11px; font-weight: 650;
    letter-spacing: .6px; text-transform: uppercase; color: var(--faint);
    border-bottom: 1px solid var(--line-soft);
  }
  .list { overflow: auto; flex: 1; padding: 6px; }
  .list .item {
    padding: 8px 10px; cursor: pointer; border-radius: 7px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-left: 3px solid transparent; transition: background .12s;
    margin-bottom: 1px;
  }
  .list .item:hover { background: var(--chip); }
  .list .item.on {
    background: var(--green-soft); border-left-color: var(--green);
    font-weight: 550;
  }
  .list .sub { display: block; color: var(--faint); font-size: 11px; }
  .list .empty { color: var(--faint); font-size: 12.5px; padding: 10px; cursor: default; }

  /* ------------------------------------------------------------------ */
  /* Code editor                                                         */
  /* ------------------------------------------------------------------ */
  /* Gutter and textarea share one font and line-height, or the numbers
     drift out of step with the code they label. */
  .code { flex: 1; display: flex; min-height: 0; background: var(--code-bg); }
  .gutter, textarea#script {
    font: 13.5px/1.65 "Cascadia Code", "Cascadia Mono", Consolas, "Courier New", monospace;
    padding-top: 14px; padding-bottom: 14px;
  }
  .gutter {
    padding-left: 14px; padding-right: 12px; min-width: 46px;
    text-align: right; white-space: pre; overflow: hidden;
    color: var(--faint); user-select: none;
    background: var(--gutter-bg); border-right: 1px solid var(--line-soft);
  }
  textarea#script {
    flex: 1; width: 100%; border: 0; outline: none; resize: none;
    padding-left: 16px; padding-right: 16px;
    tab-size: 4; background: var(--code-bg); color: var(--ink);
    caret-color: var(--green);
  }
  textarea#script::placeholder { color: var(--faint); }

  .editor-status {
    padding: 8px 16px; font-size: 12.5px; color: var(--muted);
    border-top: 1px solid var(--line); background: var(--surface);
    white-space: pre-wrap; max-height: 130px; overflow: auto;
  }
  .editor-status.bad { color: var(--bad); background: var(--bad-soft); }
  .editor-status.good { color: var(--green-dark); background: var(--green-soft); }

  /* ------------------------------------------------------------------ */
  /* Assistant dock                                                      */
  /* ------------------------------------------------------------------ */
  /* Smaller than the editor by default and draggable, since the script is
     the thing you read and the conversation is the thing you glance at. */
  .chat {
    position: relative;
    height: var(--chat-h, 50vh); min-height: 110px; max-height: 94vh;
    overflow: hidden;
    display: flex; flex-direction: column;
    border-top: 1px solid var(--line); background: var(--surface);
    box-shadow: 0 -1px 3px rgba(16, 24, 40, .05);
  }

  /* The saved-chat rail sits beside the conversation, inside the resizable
     strip, so dragging the chat taller gives both of them the room. */
  .chatbody { flex: 1; display: flex; min-height: 0; }
  .convo { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .history {
    width: 208px; flex: none; display: flex; flex-direction: column;
    min-height: 0; background: var(--raised);
    border-right: 1px solid var(--line);
  }
  .history-head {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px 6px 12px; border-bottom: 1px solid var(--line-soft);
  }
  .history-head .panel-title { flex: 1; padding: 0; border: 0; }
  .history-head button {
    font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 6px;
  }
  .history-list { flex: 1; overflow: auto; padding: 5px; }
  .history-empty {
    color: var(--faint); font-size: 12px; padding: 10px 8px; line-height: 1.45;
  }

  /* Row is the hit target; the delete button rides on top of it, so the two
     cannot be nested buttons. */
  .chat-item { position: relative; display: flex; }
  .chat-item .open {
    flex: 1; min-width: 0; text-align: left; border: 1px solid transparent;
    background: transparent; padding: 6px 48px 6px 8px; border-radius: 7px;
    display: flex; flex-direction: column; gap: 1px; font-weight: 500;
  }
  .chat-item .open:hover { background: var(--chip); border-color: var(--line); }
  .chat-item.on .open {
    background: var(--accent-soft); border-color: var(--accent); color: var(--ink);
  }
  .chat-item .t {
    font-size: 12.5px; line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chat-item .m { font-size: 10.5px; color: var(--faint); }
  .chat-item .del, .chat-item .rename {
    position: absolute; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; color: var(--faint);
    font-size: 15px; line-height: 1; padding: 3px 6px; border-radius: 5px;
    opacity: 0; transition: opacity .12s;
  }
  .chat-item .del { right: 4px; }
  .chat-item .rename { right: 26px; font-size: 12px; }
  .chat-item:hover .del, .chat-item .del:focus-visible,
  .chat-item:hover .rename, .chat-item .rename:focus-visible { opacity: 1; }
  .chat-item .del:hover { color: var(--bad); background: var(--bad-soft); }
  .chat-item .rename:hover { color: var(--ink); background: var(--chip); }

  /* Before the first message the input is the main event, not a strip at
     the bottom of the screen: welcome, suggestions and the box sit together
     in the middle. The first question docks everything back down so the
     conversation has the room. */
  .chat.empty .convo { justify-content: center; }
  .chat.empty .log { flex: 0 0 auto; overflow: visible; padding-bottom: 0; }
  .chat.empty .log .msg { max-width: 760px; }
  .chat.empty form { border-top: 0; }
  .chat.empty form, .chat.empty .chips, .chat.empty .hint { max-width: 792px; }
  .chat.empty textarea { padding: 13px 17px; font-size: 15px; }
  .chat .log { flex: 1; overflow: auto; padding: 16px 18px 8px; }

  .msg { margin: 0 auto 14px; max-width: 980px; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .msg .who {
    font-size: 10.5px; font-weight: 650; letter-spacing: .5px;
    color: var(--faint); text-transform: uppercase; margin-bottom: 3px;
    display: flex; align-items: center; gap: 6px;
  }
  .msg .who::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
  }
  .msg.you .who::before { background: var(--accent); }
  .msg.you .who { color: var(--accent); }

  /* Copy, on every message. Hidden until the message is hovered so the log
     stays quiet, but always reachable by keyboard. */
  .msg .copy {
    margin-left: auto; font: 11px "Segoe UI", system-ui, sans-serif;
    text-transform: none; letter-spacing: 0; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; color: var(--muted);
    background: var(--surface); border: 1px solid var(--line);
    opacity: 0; transition: opacity .15s, color .15s, border-color .15s;
  }
  .msg:hover .copy, .msg .copy:focus-visible { opacity: 1; }
  .msg .copy:hover { color: var(--ink); border-color: var(--faint); }
  .msg .copy.done { opacity: 1; color: var(--green); border-color: var(--green); }
  .msg .body {
    white-space: pre-wrap; padding: 9px 13px; border-radius: 10px;
    background: var(--bot-bubble); width: fit-content; max-width: 100%;
    line-height: 1.55;
  }
  .msg.you .body { background: var(--you-bubble); }
  .msg.note .body {
    background: var(--accent-soft); font-size: 13px; color: var(--muted);
    border: 1px dashed var(--line);
  }

  /* Rendered markdown. Plain bubbles keep pre-wrap for their newlines; here
     the block tags carry the spacing, so pre-wrap would double every gap. */
  .msg .body.md { white-space: normal; }
  .msg .body.md > :first-child { margin-top: 0; }
  .msg .body.md > :last-child { margin-bottom: 0; }
  .msg .body.md p { margin: 0 0 9px; }
  .msg .body.md h1, .msg .body.md h2, .msg .body.md h3,
  .msg .body.md h4, .msg .body.md h5, .msg .body.md h6 {
    margin: 15px 0 7px; line-height: 1.3; font-weight: 600;
  }
  .msg .body.md h1 { font-size: 1.32em; }
  .msg .body.md h2 { font-size: 1.18em; }
  .msg .body.md h3 { font-size: 1.07em; }
  .msg .body.md h4, .msg .body.md h5, .msg .body.md h6 {
    font-size: 1em; color: var(--muted);
  }
  .msg .body.md h1, .msg .body.md h2 {
    padding-bottom: 4px; border-bottom: 1px solid var(--line);
  }
  .msg .body.md ul, .msg .body.md ol { margin: 0 0 9px; padding-left: 21px; }
  .msg .body.md li { margin: 2px 0; }
  .msg .body.md li > ul, .msg .body.md li > ol { margin: 2px 0; }
  .msg .body.md blockquote {
    margin: 0 0 9px; padding: 1px 0 1px 11px; color: var(--muted);
    border-left: 3px solid var(--line);
  }
  .msg .body.md hr {
    border: 0; border-top: 1px solid var(--line); margin: 13px 0;
  }
  .msg .body.md a { color: var(--accent); }
  .msg .body.md code { font: 12.5px/1.5 "Cascadia Code", Consolas, monospace; }
  .msg .body.md :not(pre) > code {
    background: var(--chip); border: 1px solid var(--line-soft);
    padding: 1px 5px; border-radius: 4px;
  }
  .msg .body.md pre {
    margin: 0 0 9px; padding: 9px 11px; border-radius: 8px;
    background: var(--code-bg); border: 1px solid var(--line);
    overflow-x: auto; white-space: pre;
  }
  .msg .body.md pre[data-lang]::before {
    content: attr(data-lang); display: block; margin-bottom: 6px;
    font: 10.5px/1 "Cascadia Code", Consolas, monospace;
    letter-spacing: .05em; text-transform: uppercase; color: var(--faint);
  }
  /* A wide table must scroll inside the bubble, not stretch it off-screen. */
  .msg .body.md .tablewrap { overflow-x: auto; margin: 0 0 9px; }
  .msg .body.md table { border-collapse: collapse; font-size: 13px; }
  .msg .body.md th, .msg .body.md td {
    border: 1px solid var(--line); padding: 5px 9px; text-align: left;
  }
  .msg .body.md th { background: var(--gutter-bg); font-weight: 600; }
  .msg .body.md th.r, .msg .body.md td.r { text-align: right; }
  .msg .body.md th.c, .msg .body.md td.c { text-align: center; }

  /* Tool calls as chips: pending pulses, done gets a tick, failed a cross. */
  .acts { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 6px; }
  .chip {
    font: 11.5px "Cascadia Code", Consolas, monospace;
    padding: 2.5px 9px; border-radius: 999px;
    background: var(--chip); color: var(--muted);
    border: 1px solid var(--line); display: inline-flex; gap: 5px;
    align-items: center;
  }
  .chip::before { content: "●"; font-size: 8px; color: var(--faint); }
  .chip.run::before { color: var(--accent); animation: blink 1s ease-in-out infinite; }
  .chip.ok::before { content: "✓"; font-size: 10px; color: var(--green); }
  .chip.fail::before { content: "✕"; font-size: 10px; color: var(--bad); }
  .chip.fail { border-color: var(--bad); color: var(--bad); }
  @keyframes blink { 50% { opacity: .25; } }

  /* Typing indicator while the model has said nothing yet. */
  .dots { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .dots i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--faint);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 30% { transform: translateY(-4px); opacity: 1; } }

  /* Suggestion chips - one click instead of knowing what to type. */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; padding: 4px 18px 10px;
           max-width: 1016px; margin: 0 auto; width: 100%; }
  .chips button {
    font-size: 12.5px; padding: 5px 12px; border-radius: 999px;
    color: var(--muted); background: var(--surface);
  }
  .chips button:hover:not(:disabled) { color: var(--ink); border-color: var(--green); }

  .chat form { display: flex; gap: 9px; padding: 10px 18px 6px;
               border-top: 1px solid var(--line-soft); align-items: flex-end;
               max-width: 1016px; margin: 0 auto; width: 100%; }
  .chat textarea {
    flex: 1; font: inherit; padding: 10px 14px;
    border: 1.5px solid color-mix(in srgb, var(--muted) 40%, var(--line));
    border-radius: 10px; outline: none;
    background: var(--bg); color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
    /* One line to start with, growing as the question does and stopping a
       few lines in - past that it would push the conversation off screen. */
    resize: none; overflow-y: auto; line-height: 1.45; max-height: 160px;
  }
  .chat textarea::placeholder { color: var(--faint); }
  .chat textarea:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 18%, transparent);
  }
  .hint { color: var(--faint); font-size: 12px; padding: 0 18px 10px;
          max-width: 1016px; margin: 0 auto; width: 100%; }

<header>

    <span class="who" id="whoami"></span>
    <button id="btnSignOut" data-i18n="signOut">Sign out</button>
  </div>
</header>

<!-- Only ever shown to an administrator standing in for somebody else. It is
     deliberately loud: every question asked from here lands in that person's
     conversation, under their Qlik identity. -->
<div class="acting" id="actingBar" hidden>
  <span id="actingText"></span>
  <button id="btnStopActing" data-i18n="stopActing">Stop</button>
</div>

<!-- The connection to Qlik went away. The server rebuilds it by itself on
     the next request, so this only appears when that did not work - Qlik is
     genuinely down or still restarting. Then there is one thing to press,
     rather than a red line about a websocket and a phone call to whoever
     can restart the server. -->
<div class="offline" id="offlineBar" hidden>
  <span id="offlineText"></span>
  <button id="btnReconnect" data-i18n="reconnect">Reconnect</button>
</div>

<main>

// choice is remembered per machine afterwards. Guarded like the theme code:
// with site data blocked the accessor itself throws, and an exception here
// runs at top level - the whole UI script dies with it.
let lang = "";
try { lang = localStorage.getItem("qlik-ai-lang") || ""; } catch (_) {}
if (!STRINGS[lang]) {
  const guess = (navigator.language || "en").slice(0, 2).toLowerCase();
  lang = STRINGS[guess] ? guess : "en";
}

function t(key, vars) {
  const table = STRINGS[lang] || STRINGS.en;
  let text = table[key];
  if (text === undefined) text = STRINGS.en[key];
  if (text === undefined) return key;
  if (typeof text !== "string") return text;
  if (vars) {
    text = text.replace(/\{(\w+)\}/g, (whole, name) =>
      vars[name] === undefined ? whole : vars[name]);
  }
  return text;
}

// Everything painted from a template is re-rendered by its own function; this
// covers the markup that is written once in the page itself.
function applyLanguage() {
  document.documentElement.lang = lang;
  const set = (attribute, apply) =>
    document.querySelectorAll("[" + attribute + "]").forEach(el =>
      apply(el, t(el.getAttribute(attribute))));

  set("data-i18n", (el, text) => { el.textContent = text; });
  set("data-i18n-title", (el, text) => { el.title = text; });
  set("data-i18n-ph", (el, text) => { el.placeholder = text; });
  set("data-i18n-aria", (el, text) => { el.setAttribute("aria-label", text); });
}

function setStatus(text, kind) {
  const el = $("status");
  el.textContent = text || "";
  el.className = "editor-status" + (kind ? " " + kind : "");
}

async function api(path, options) {
  const response = await fetch(path, options);
  // A session expires while the page is still open, and every button then
  // fails with a message about being signed out that nobody can act on from
  // here. Go to the login page instead, which is the thing to do about it.
  if (response.status === 401) {
    window.location.replace("/login");
    throw new Error("signed out");
  }
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch (_) {}
    const error = new Error(detail);
    // The server marks the one failure a person can do something about:
    // the Qlik connection is gone and could not be rebuilt. Everything else
    // is a message; this one is a message with a button.
    if (response.headers.get("X-Qlik-Reconnect") === "1") {
      error.reconnect = true;
      showOffline(detail);
    }
    throw error;
  }
  // Any answer at all means the connection is back - including one from a
  // request the person made for some other reason. The banner should not
  // outlive the problem and wait to be dismissed.
  hideOffline();
  return response.json();
}

// ----------------------------------------------------------------------
// Losing Qlik, and getting it back
// ----------------------------------------------------------------------

function showOffline(detail) {
  $("offlineText").textContent = detail || t("qlikLost");
  $("offlineBar").hidden = false;
}

function hideOffline() {
  $("offlineBar").hidden = true;
}

$("btnReconnect").onclick = async () => {
  const button = $("btnReconnect");
  button.classList.add("busy");
  $("offlineText").textContent = t("reconnecting");
  try {
    await api("/api/reconnect", {method: "POST"});
    hideOffline();
    setStatus(t("reconnected"), "good");
    // Put the page back the way it was: the script, the sheets and the
    // connections were all read through the connection that had gone.
    await load();
  } catch (e) {
    // api() has already re-shown the banner with the current reason.
    showOffline(e.message);
  } finally {
    button.classList.remove("busy");
  }
};

function renderGutter() {
  const lines = $("script").value.split("\n").length;
  $("gutter").textContent =
    Array.from({length: lines}, (_, i) => i + 1).join("\n");
}

// Set the script and keep the line numbers in step. Every path that changes
// the buffer goes through here, so the gutter can't fall out of sync.
function setScript(text) {
  $("script").value = text;
  renderGutter();
}

$("script").addEventListener("input", renderGutter);
$("script").addEventListener("scroll", () => {
  $("gutter").scrollTop = $("script").scrollTop;
});

// Ctrl+S saves the script instead of the browser offering to save the page,
// and Tab indents instead of leaving the editor - both what an editor does.
$("script").addEventListener("keydown", event => {
  if ((event.ctrlKey || event.metaKey) && event.key === "s") {
    event.preventDefault();
    $("btnSave").click();
  } else if (event.key === "Tab") {
    event.preventDefault();
    const el = event.target;
    const start = el.selectionStart;
    el.setRangeText("\t", start, el.selectionEnd, "end");
    renderGutter();
  }
});

function renderTabs(tabs) {
  const box = $("tabs");
  box.innerHTML = "";
  tabs.forEach(name => {
    const item = document.createElement("div");
    item.className = "item" + (name === currentTab ? " on" : "");
    item.textContent = name;
    // Selecting a section scrolls the editor to it. The whole script stays
    // in one editable buffer so the assistant and the person are never
    // editing different copies of it.
    item.onclick = () => { currentTab = name; scrollToTab(name); renderTabs(tabs); };
    box.appendChild(item);
  });
}

function scrollToTab(name) {
  const editor = $("script");
  const index = editor.value.indexOf("///$tab " + name);
  if (index < 0) return;
  const line = editor.value.slice(0, index).split("\n").length;
  editor.focus();
  editor.setSelectionRange(index, index);
  editor.scrollTop = Math.max(0, (line - 2) * 22);
}

function renderConnections(connections) {
  const box = $("connections");
  box.innerHTML = "";
  if (!connections.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = t("noConnections");
    box.appendChild(empty);
    return;
  }
  connections.forEach(connection => {
    const item = document.createElement("div");
    item.className = "item";
    item.title = connection.path || "";
    const sub = document.createElement("span");
    sub.className = "sub";
    sub.textContent = connection.type || "";
    item.textContent = connection.name;
    item.appendChild(sub);
    item.onclick = () => ask(t("askConnection", {name: connection.name}));
    box.appendChild(item);
  });
}

function renderChips() {
  const box = $("chips");
  box.innerHTML = "";
  t("suggestions").forEach(text => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.textContent = text;
    chip.onclick = () => ask(text);
    box.appendChild(chip);
  });
}

// Qlik Sense Desktop keeps its own in-memory copy of an open app, so a sheet
// created here is on disk but invisible in a Qlik window that was already
// open. Showing the file's timestamp makes it obvious the work was saved and
// that Qlik is the one holding a stale copy.
function noteQlikCache(file) {
  const stamp = file && file.modified ? t("savedStamp", {when: file.modified}) : "";
  const note = document.createElement("div");
  note.className = "msg note";
  note.innerHTML = '<div class="who"></div>';
  note.firstChild.textContent = t("note");
  const body = document.createElement("div");
  body.className = "body";
  body.textContent = t("qlikCacheNote", {stamp});
  note.firstChild.appendChild(copyButton(() => body.textContent));
  note.appendChild(body);
  $("log").appendChild(note);
  $("log").scrollTop = $("log").scrollHeight;
}

// Copy that also works over plain http:// on a LAN address, where the
// clipboard API is unavailable because the page isn't a secure context.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (_) {
    const scratch = document.createElement("textarea");
    scratch.value = text;
    scratch.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(scratch);
    scratch.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) {}
    scratch.remove();
    return ok;
  }
}

// ---- Markdown -------------------------------------------------------------
// The model answers in markdown. Rendering it here instead of pulling in a
// library keeps the page working on an air-gapped Qlik box. Every value is
// escaped before a tag is emitted, so neither model output nor a table cell
// lifted straight out of the user's data can inject markup.

const ESCAPE = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"};
const esc = s => String(s).replace(/[&<>"']/g, c => ESCAPE[c]);

const RE_FENCE = /^ {0,3}(`{3,}|~{3,})[ \t]*([\w+#.-]*)[ \t]*$/;
const RE_HEAD  = /^ {0,3}(#{1,6})\s+(.*?)\s*#*\s*$/;
const RE_HR    = /^ {0,3}([-*_])[ \t]*(?:\1[ \t]*){2,}$/;
const RE_QUOTE = /^ {0,3}>\s?(.*)$/;
const RE_ITEM  = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
const RE_DELIM = /^ {0,3}\|?[ \t]*:?-+:?[ \t]*(\|[ \t]*:?-+:?[ \t]*)*\|?[ \t]*$/;

const startsBlock = l =>
  RE_FENCE.test(l) || RE_HEAD.test(l) || RE_HR.test(l) ||
  RE_QUOTE.test(l) || RE_ITEM.test(l);

// Only schemes that cannot execute. Anything else keeps its label as plain
// text, so a "javascript:" link degrades into words instead of a trap.
const href = (url, label) =>
  /^(https?:\/\/|mailto:|#)/i.test(url.replace(/&amp;/g, "&"))
    ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`
    : label;

function mdInline(raw) {
  // Code spans come out first so their contents survive untouched: `**x**`
  // between backticks has to stay asterisks.
  // The placeholder is wrapped in angle brackets because esc() has already
  // removed every raw one, so "<0>" cannot collide with the text itself. The
  // tags added below are never all-digits, so they survive the restore too.
  const spans = [];
  let s = esc(raw).replace(/`([^`]+)`/g, (_, code) =>
    "<" + (spans.push(`<code>${code}</code>`) - 1) + ">");

  s = s.replace(/!?\[([^\]]*)\]\(([^)\s]+)(?:[ \t]+&quot;[^&]*&quot;)?\)/g,
                (_, label, url) => href(url, label || url))
       .replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>")
       .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>")
       .replace(/(^|[^_\w])__([^_]+)__/g, "$1<strong>$2</strong>")
       .replace(/(^|[^_\w])_([^_\n]+)_(?![_\w])/g, "$1<em>$2</em>")
       .replace(/~~([^~]+)~~/g, "<del>$1</del>");

  return s.replace(/<(\d+)>/g, (_, i) => spans[i]);
}

function renderMarkdown(src) {
  return mdBlocks(String(src == null ? "" : src).replace(/\r\n?/g, "\n").split("\n"));
}

function mdBlocks(lines) {
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    const fence = RE_FENCE.exec(line);
    if (fence) {
      const mark = fence[1], lang = fence[2], buf = [];
      const closes = l => {
        const m = RE_FENCE.exec(l);
        return m && m[1][0] === mark[0] && m[1].length >= mark.length && !m[2];
      };
      i++;
      // A fence with no closer is normal mid-stream. Close it and render, so
      // a code block does not flash as raw text while the tokens arrive.
      while (i < lines.length && !closes(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre${lang ? ` data-lang="${esc(lang)}"` : ""}>` +
               `<code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }

    const head = RE_HEAD.exec(line);
    if (head) {
      const n = head[1].length;
      out.push(`<h${n}>${mdInline(head[2])}</h${n}>`);
      i++;
      continue;
    }

    if (RE_HR.test(line)) { out.push("<hr>"); i++; continue; }

    if (RE_QUOTE.test(line)) {
      const buf = [];
      while (i < lines.length && RE_QUOTE.test(lines[i]))
        buf.push(RE_QUOTE.exec(lines[i++])[1]);
      out.push(`<blockquote>${mdBlocks(buf)}</blockquote>`);
      continue;
    }

    // A table is only a table if the row under the header is the delimiter.
    if (line.includes("|") && RE_DELIM.test(lines[i + 1] || "")) {
      const cells = r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|")
                          .map(c => c.trim());
      const head = cells(line);
      const align = cells(lines[i + 1]).map(c =>
        /^:-+:$/.test(c) ? ' class="c"' : /^-+:$/.test(c) ? ' class="r"' : "");
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim() && lines[i].includes("|"))
        rows.push(cells(lines[i++]));
      out.push(
        '<div class="tablewrap"><table><thead><tr>' +
        head.map((c, k) => `<th${align[k] || ""}>${mdInline(c)}</th>`).join("") +
        "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + head.map((_, k) =>
          `<td${align[k] || ""}>${mdInline(r[k] || "")}</td>`).join("") + "</tr>").join("") +
        "</tbody></table></div>");
      continue;
    }

    const item = RE_ITEM.exec(line);
    if (item) {
      const ordered = /\d/.test(item[2]);
      const indent = item[1].length;
      const items = [];
      while (i < lines.length) {
        const m = RE_ITEM.exec(lines[i]);
        if (!m || m[1].length > indent + 1 || /\d/.test(m[2]) !== ordered) break;
        const chunk = [m[3]];
        items.push(chunk);
        i++;
        // Indented follow-on lines belong to the item just opened — that is
        // how a nested list or a second paragraph hangs off a bullet.
        while (i < lines.length && lines[i].trim() && /^\s{2,}/.test(lines[i]))
          chunk.push(lines[i++].replace(/^ {1,4}/, ""));
      }
      const tag = ordered ? "ol" : "ul";
      const first = ordered ? parseInt(item[2], 10) : 1;
      out.push(`<${tag}${first > 1 ? ` start="${first}"` : ""}>` +
               items.map(c => `<li>${mdListItem(c)}</li>`).join("") +
               `</${tag}>`);
      continue;
    }

    const buf = [];
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim() || startsBlock(l)) break;
      if (l.includes("|") && RE_DELIM.test(lines[i + 1] || "")) break;
      buf.push(l);
      i++;
    }
    // Never leave the cursor unmoved: an unconsumed line would spin forever.
    if (!buf.length) { buf.push(line); i++; }
    out.push(`<p>${buf.map(l => mdInline(l.trim())).join("<br>")}</p>`);
  }

  return out.join("");
}

// A tight list: the item's own text needs no paragraph wrapper, whether or
// not a nested list follows it. Blocks after the first keep theirs.
function mdListItem(chunk) {
  return mdBlocks(chunk).replace(/^<p>((?:(?!<\/p>)[\s\S])*)<\/p>/, "$1");
}

// Rendered bodies keep their markdown source so Copy yields what the model
// actually wrote, not the flattened text the browser ends up showing.
function setBody(el, src, asMarkdown) {
  el.dataset.raw = src == null ? "" : src;
  el.classList.toggle("md", !!asMarkdown);
  if (asMarkdown) el.innerHTML = renderMarkdown(src);
  else el.textContent = src;
}

const bodyText = el => ("raw" in el.dataset ? el.dataset.raw : el.textContent);

// Re-rendering on every token would reflow the log hundreds of times for one
// long answer. One render per frame looks identical and costs far less.
function streamBody(el, after) {
  let pending = null, queued = false;
  const paint = () => {
    queued = false;
    if (pending === null) return;
    setBody(el, pending, true);
    if (after) after();
  };
  return {
    update(src) {
      pending = src;
      if (queued) return;
      queued = true;
      requestAnimationFrame(paint);
    },
    // Wins over any frame still queued, which would only repaint the same text.
    set(src) { pending = src; paint(); },
  };
}

// getText is a function, not a string: the assistant's reply is still being
// streamed when its button is created.
function copyButton(getText) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "copy";
  button.textContent = t("copy");
  button.title = t("copyTitle");
  button.onclick = async () => {
    const ok = await copyText(getText());
    button.textContent = t(ok ? "copied" : "pressCtrlC");
    button.classList.toggle("done", ok);
    setTimeout(() => {
      button.textContent = t("copy");
      button.classList.remove("done");
    }, 1400);
  };
  return button;
}

function addMessage(role, body) {
  const you = role === "user";
  const wrap = document.createElement("div");
  wrap.className = "msg" + (you ? " you" : "");
  wrap.innerHTML = `<div class="who"></div>`;
  wrap.firstChild.textContent = t(you ? "you" : "assistant");
  const text = document.createElement("div");
  text.className = "body";
  // Only the assistant writes markdown. What someone typed is shown back to
  // them exactly as typed, asterisks and all.
  setBody(text, body, !you);
  wrap.firstChild.appendChild(copyButton(() => bodyText(text)));
  wrap.appendChild(text);
  $("log").appendChild(wrap);
  $("log").scrollTop = $("log").scrollHeight;
  return text;
}

// ---- Saved conversations --------------------------------------------------
// The server owns the history: its message list is what the model actually
// remembers, so opening a chat has to go through it rather than being
// replayed from anything kept here. This code only paints the result.

let chatId = null;

// The turn currently streaming, or null. One at a time, so one controller is
// enough. Declared up here with the other page-wide state because load() and
// the submit handler both read it, and both can run before the chat section
// further down has been reached.
let turn = null;

// Coarse on purpose: the exact minute a chat was last touched is never the
// question, only roughly how long ago it was.
function ago(iso) {
  if (!iso) return "";
  const seconds = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!isFinite(seconds)) return "";
  if (seconds < 60) return t("justNow");
  if (seconds < 3600) return t("minutesAgo", {n: Math.floor(seconds / 60)});
  if (seconds < 86400) return t("hoursAgo", {n: Math.floor(seconds / 3600)});
  if (seconds < 604800) return t("daysAgo", {n: Math.floor(seconds / 86400)});
  return new Date(iso).toLocaleDateString(lang);
}

function renderHistory(chats, activeId) {
  if (activeId !== undefined) chatId = activeId;
  const box = $("historyList");
  box.innerHTML = "";

  if (!chats || !chats.length) {
    const empty = document.createElement("div");
    empty.className = "history-empty";
    empty.textContent = t("noChats");
    box.appendChild(empty);
    return;
  }

  for (const chat of chats) {
    const row = document.createElement("div");
    row.className = "chat-item" + (chat.id === chatId ? " on" : "");

    const open = document.createElement("button");
    open.type = "button";
    open.className = "open";
    open.title = chat.title || "";
    const title = document.createElement("span");
    title.className = "t";
    title.textContent = chat.title || t("untitled");
    const meta = document.createElement("span");
    meta.className = "m";
    meta.textContent = [
      chat.turns === 1 ? t("turnOne") : t("turns", {n: chat.turns}),
      chat.app,
      ago(chat.updated),
    ].filter(Boolean).join(" · ");
    open.append(title, meta);
    open.onclick = () => openChat(chat.id);

    const rename = document.createElement("button");
    rename.type = "button";
    rename.className = "rename";
    rename.textContent = "✎";
    rename.title = t("renameChatTitle");
    rename.onclick = event => {
      event.stopPropagation();
      renameChat(chat.id, chat.title);
    };

    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "×";
    del.title = t("deleteChatTitle");
    del.onclick = event => {
      event.stopPropagation();
      removeChat(chat.id, chat.title);
    };

    row.append(open, rename, del);
    box.appendChild(row);
  }
}

// Only what was actually said: the server leaves the system prompt and the
// tool traffic out, so reopening a chat shows the conversation, not the log.
function repaint(entries) {
  $("log").innerHTML = "";
  for (const entry of entries || []) {
    addMessage(entry.role, entry.content);
  }
  welcome();
  $("log").scrollTop = $("log").scrollHeight;
}

async function refreshHistory() {
  // History is a convenience. Losing the list must not take the chat with it.
  try {
    const result = await api("/api/chats");
    renderHistory(result.chats, result.chat_id);
  } catch (e) {
    console.warn("Could not list saved chats:", e.message);
  }
}

async function openChat(id) {
  if (id === chatId) return;
  try {
    // POST: opening switches the server's live conversation, and a GET
    // that mutates gets prefetched by the browser into surprise switches.
    const chat = await api("/api/chats/" + encodeURIComponent(id) + "/open",
                           {method: "POST"});
    chatId = chat.chat_id;
    repaint(chat.transcript);
    // The chat's app could not be reopened: the transcript is back, but
    // the answers are about a different app than the one open now.
    if (chat.warning) setStatus(chat.warning, "bad");
    if (chat.app_switched) {
      // Opening the chat switched back to the app it was about, so the
      // editor needs that app's script and tabs, not just the transcript.
      await load();
      return;
    }
    // Re-read so the highlight lands on the chat now open. The order itself
    // no longer changes: visiting a chat does not re-date it.
    await refreshHistory();
  } catch (e) {
    setStatus(t("couldNotOpenChat", {error: e.message}), "bad");
  }
}

async function newChat() {
  try {
    const result = await api("/api/chats", {method: "POST"});
    repaint([]);
    renderHistory(result.chats, result.chat_id);
    $("chatInput").focus();
  } catch (e) {
    setStatus(t("couldNotStartChat", {error: e.message}), "bad");
  }
}

// Renaming touches the name and nothing else: the chat keeps its place in
// the list, because it is ordered by when it was last talked in.
async function renameChat(id, current) {
  const title = prompt(t("renamePrompt"), current || "");
  if (title === null || !title.trim()) return;
  try {
    const result = await api("/api/chats/" + encodeURIComponent(id), {
      method: "PATCH",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({title}),
    });
    renderHistory(result.chats, result.chat_id);
  } catch (e) {
    setStatus(t("couldNotRenameChat", {error: e.message}), "bad");
  }
}

async function removeChat(id, title) {
  if (!confirm(t("deleteConfirm", {title: title || t("thisChat")}))) return;
  try {
    const wasOpen = id === chatId;
    const result = await api("/api/chats/" + encodeURIComponent(id), {method: "DELETE"});
    // Deleting the chat you are reading leaves a fresh empty one in its place.
    if (wasOpen) repaint([]);
    renderHistory(result.chats, result.chat_id);
  } catch (e) {
    setStatus(t("couldNotDeleteChat", {error: e.message}), "bad");
  }
}

$("btnNewChat").onclick = newChat;

function welcome() {
  if (!$("log").children.length) {
    addMessage("assistant", t("welcome"));
  }
  // Centered input until a conversation exists, docked once it does. Keyed
  // on real user messages, not just log entries, so the welcome text alone
  // still counts as "empty".
  $("chat").classList.toggle("empty", !$("log").querySelector(".msg.you"));
}

function renderOptions(options) {
  const appSel = $("appSel");
  appSel.innerHTML = "";
  options.apps.forEach(name => {
    const option = new Option(name, name, false, name === options.app);
    appSel.appendChild(option);
  });

  const modelSel = $("modelSel");
  modelSel.innerHTML = "";
  options.models.forEach(model => {
    // Unusable models stay visible but disabled, so it's clear why a model
    // you have installed isn't an option rather than it silently missing.
    // Cloud models are selectable but labelled - they are much faster, and
    // they are also the one choice that sends your data off the machine.
    const size = model.size_gb ? ` (${model.size_gb}G)` : "";
    const why = model.reason ? ` - ${model.reason}` : "";
    const option = new Option(
      (model.cloud ? "☁ " : "") + model.name + size + why,
      model.name, false, model.name === options.model
    );
    option.disabled = !model.usable;
    // Carried as data rather than read back out of the label: the ☁ prefix
    // is display text, and sniffing it breaks the moment the label is
    // reworded or a model name happens to start the same way.
    if (model.cloud) option.dataset.cloud = "1";
    modelSel.appendChild(option);
  });
}

async function select(change) {
  setStatus(t("switching"));
  try {
    await api("/api/select", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(change),
    });
    currentTab = null;
    await load();
    setStatus("");
  } catch (e) {
    setStatus(t("couldNotSwitch", {error: e.message}), "bad");
    await load();
  }
}

$("appSel").onchange = event => {
  // The conversation was about the previous app's fields, so the server
  // files it away and starts a fresh one. load() then paints the new state.
  $("log").innerHTML = "";
  select({app: event.target.value});
};
$("modelSel").onchange = event => {
  const chosen = event.target.selectedOptions[0];
  if (chosen.dataset.cloud && !confirm(t("cloudModelConfirm"))) {
    load();
    return;
  }
  select({model: event.target.value});
};
$("allowReload").onchange = event => select({allow_reload: event.target.checked});

// ---- Who is signed in -----------------------------------------------------

// Rendered from /api/state rather than a call of its own: the page already
// waits on that one, and a second request only to name the person would put
// a second round trip in front of the first paint.
function renderAccount(user) {
  const box = $("account");
  if (!user) { box.hidden = true; return; }
  box.hidden = false;

  const name = user.display_name || user.username;
  $("whoami").textContent = name;
  $("whoami").title = t("signedInAs", {name: name});
  $("adminLink").hidden = !user.is_admin;

  const acting = $("actingBar");
  acting.hidden = !user.impersonating;
  if (user.impersonating) {
    $("actingText").textContent = t("actingAs", {name: name});
  }
}

$("btnSignOut").onclick = async () => {
  try { await api("/api/logout", {method: "POST"}); } catch (e) {}
  window.location.replace("/login");
};

$("btnStopActing").onclick = async () => {
  try {
    await api("/api/admin/act-as", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_id: null}),
    });
    window.location.reload();
  } catch (e) {
    setStatus(e.message, "bad");
  }
};

async function load() {
  const state = await api("/api/state");
  renderAccount(state.user);
  $("meta").textContent = state.mode;
  $("allowReload").checked = state.allow_reload !== false;
  // Qlik works without Ollama; only the assistant needs it. Say which half
  // is down instead of looking broken.
  const ready = state.assistant_ready !== false;
  $("chatInput").placeholder = t(ready ? "askPlaceholder" : "askPlaceholderOffline");
  $("chatHint").textContent = t(ready ? "hint" : "hintOffline");
  setScript(state.script);
  currentTab = currentTab || state.tabs[0] || null;
  renderTabs(state.tabs);
  renderConnections(state.connections);
  renderChips();
  // The server kept the conversation across the refresh; put it back on
  // screen rather than greeting someone mid-chat with an empty log.
  chatId = state.chat_id || null;
  // Not while a turn is streaming. repaint() empties the log and rebuilds it
  // from the server's transcript, and this turn is not in that transcript
  // yet - it is persisted when it finishes. Mid-stream that erases the
  // question and the half-written answer, and leaves the stream writing into
  // a node no longer in the page, so the reply never appears at all.
  // Switching language is the way in: it calls load() to repaint the chrome.
  if (!turn) repaint(state.transcript);
  refreshHistory();
  try {
    renderOptions(await api("/api/options"));
  } catch (e) {
    $("meta").textContent = `${state.mode} · ${state.model}`;
  }
}

$("btnSave").onclick = async () => {
  setStatus(t("saving"));
  try {
    const result = await api("/api/script", {
      method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({content: $("script").value}),
    });
    renderTabs(result.tabs);
    const saved = await api("/api/save", {method: "POST"});
    const stamp = saved.file && saved.file.modified ? ` at ${saved.file.modified}` : "";
    setStatus(t("saved", {stamp}), "good");
  } catch (e) {
    setStatus(t("notSaved", {error: e.message}), "bad");
  }
};

$("btnReload").onclick = async () => {
  if (!confirm(t("loadConfirm"))) return;
  setStatus(t("loadingData"));
  const btn = $("btnReload");
  btn.disabled = true;
  btn.classList.add("busy");
  try {
    // Save the buffer first, or the reload runs the previous script.
    await api("/api/script", {
      method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({content: $("script").value}),
    });
    const result = await api("/api/reload", {method: "POST"});
    if (result.success) {
      const tables = (result.tables || [])
        .map(t => `${t.name}: ${t.rows.toLocaleString()} rows`).join("\n");
      setStatus(t("loadedRows", {rows: (result.total_rows || 0).toLocaleString(), tables}), "good");
      await api("/api/save", {method: "POST"});
    } else {
      setStatus(t("loadFailed", {error: (result.errors || []).join("\n")}), "bad");
    }
  } catch (e) {
    setStatus(t("loadFailed", {error: e.message}), "bad");
  } finally {
    btn.disabled = false;
    btn.classList.remove("busy");
  }
};

function typingDots() {
  const dots = document.createElement("span");
  dots.className = "dots";
  dots.innerHTML = "<i></i><i></i><i></i>";
  return dots;
}

// Streamed: each tool call shows the moment it is decided and the answer
// arrives word by word. A local model can take minutes on a multi-step
// request, and waiting in silence for it is indistinguishable from a hang.
async function ask(question) {
  $("chat").classList.remove("empty");
  addMessage("user", question);

  const wrap = document.createElement("div");
  wrap.className = "msg";
  wrap.innerHTML = '<div class="who"></div>';
  wrap.firstChild.textContent = t("assistant");
  const acts = document.createElement("div");
  acts.className = "acts";
  const body = document.createElement("div");
  body.className = "body";
  body.appendChild(typingDots());
  wrap.firstChild.appendChild(copyButton(() => bodyText(body)));
  wrap.append(acts, body);
  $("log").appendChild(wrap);

  const scroll = () => { $("log").scrollTop = $("log").scrollHeight; };
  scroll();
  const stream = streamBody(body, scroll);

  // The button becomes Stop for the duration. A local model can run for
  // minutes, and a question sent by accident otherwise has to be waited out.
  setSending(true);
  let answer = "";
  let chip = null;
  const done = [];

  try {
    const response = await fetch("/api/chat/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: question}),
      signal: turn.signal,
    });
    // Not api(): this one reads the body as a stream rather than as JSON.
    // The failure handling still has to match, or a lost connection during a
    // question shows "Service Unavailable" and no way to act on it - while
    // every other button on the page offers Reconnect.
    if (!response.ok) {
      let detail = response.statusText;
      try { detail = (await response.json()).detail || detail; } catch (_) {}
      if (response.headers.get("X-Qlik-Reconnect") === "1") showOffline(detail);
      throw new Error(detail);
    }
    hideOffline();

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    for (;;) {
      const {value, done: finished} = await reader.read();
      if (finished) break;
      buffer += decoder.decode(value, {stream: true});

      // SSE frames are separated by a blank line.
      const frames = buffer.split("\n\n");
      buffer = frames.pop();

      for (const frame of frames) {
        const line = frame.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        const event = JSON.parse(line.slice(6));

        if (event.type === "tool") {
          done.push(event.name);
          chip = document.createElement("span");
          chip.className = "chip run";
          chip.textContent = event.name;
          acts.appendChild(chip);
          scroll();
        } else if (event.type === "tool_result") {
          if (chip) {
            chip.className = "chip " + (event.ok ? "ok" : "fail");
            if (!event.ok && event.detail) chip.title = event.detail;
          }
          scroll();
        } else if (event.type === "token") {
          if (!answer) body.textContent = "";   // clears the typing dots
          answer += event.text;
          stream.update(answer);
        } else if (event.type === "done") {
          stream.set(event.reply || answer || "(no answer)");
        } else if (event.type === "error") {
          setBody(body, "Error: " + event.message, false);
          scroll();
        } else if (event.type === "final") {
          // The first question is what names the chat, and may be what
          // created it — so the rail is refreshed from the same event.
          if (event.chats) renderHistory(event.chats, event.chat_id);
          if (event.script_changed) {
            setScript(event.script);
            renderTabs(event.tabs);
            setStatus(t("scriptChanged"), "good");
          }
          if (event.sheets_changed) noteQlikCache(event.file);
        }
      }
    }
  } catch (e) {
    // Aborting a fetch rejects it, which is not a failure worth showing as
    // one - the user asked for it. What they do need is to see that what ran
    // before they pressed Stop is still on the sheet.
    if (e.name === "AbortError") {
      // Only mention what survived if something actually ran. Telling
      // someone their work is safe after a turn that did nothing but type
      // reads as though it built something and hid it.
      stream.set(
        (answer ? answer + "\n\n" : "") + t(done.length ? "stoppedKept" : "stopped")
      );
    } else {
      setBody(body, "Error: " + e.message, false);
    }
  } finally {
    if (!done.length) acts.remove();
    setSending(false);
    $("chatInput").focus();
  }
}

function setSending(sending) {
  const button = $("btnSend");
  // Cleared on the way out as well as set on the way in: the form's submit
  // handler reads this to decide whether it is sending or stopping, so a
  // stale controller would leave the button stopping a turn that had
  // already finished.
  turn = sending ? new AbortController() : null;
  button.textContent = sending ? t("stop") : t("send");
  button.dataset.i18n = sending ? "stop" : "send";
  button.classList.toggle("stopping", sending);
  // Never disabled now: disabling it was what made a mistyped question
  // something you had to sit through.
  button.disabled = false;
}

function stopTurn() {
  if (turn) turn.abort();
}

// The box is a textarea so a question can have more than one line in it -
// an <input> cannot hold a newline at all. A textarea does not submit on
// Enter by itself, so the two keys are wired up here: Enter sends, and
// Shift+Enter does what it does everywhere else and breaks the line.
function submitQuestion() {
  // Enter during a turn would start a second one, which the server
  // serialises on its own lock - so the question sits there looking ignored
  // until the first finishes. Stop first, then ask.
  if (turn) return;
  const box = $("chatInput");
  const question = box.value.trim();
  if (!question) return;
  box.value = "";
  growInput();
  ask(question);
}

// Grown to fit rather than scrolled: a question worth typing over several
// lines is worth being able to read back before sending it.
function growInput() {
  const box = $("chatInput");
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 160) + "px";
}

$("chatInput").addEventListener("input", growInput);

$("chatInput").addEventListener("keydown", event => {
  // isComposing: mid-composition Enter is the IME accepting a character,
  // not the person sending - and this interface is used in three languages.
  if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
  event.preventDefault();
  submitQuestion();
});

$("chatForm").onsubmit = event => {
  event.preventDefault();
  // The same button does both jobs, so which one depends on whether a turn
  // is in flight. Submitting while streaming means Stop.
  if (turn) stopTurn(); else submitQuestion();
};

// ----------------------------------------------------------------------
// Theme. The head script already applied the saved choice; this wires the
// picker and keeps "Auto" following the machine while the page is open.
// ----------------------------------------------------------------------
const THEME_KEY = "qlikai-theme";
const systemDark = matchMedia("(prefers-color-scheme: dark)");
let themePref = "system";
try { themePref = localStorage.getItem(THEME_KEY) || "system"; } catch (_) {}

function applyTheme() {
  const dark = themePref === "dark" || (themePref !== "light" && systemDark.matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("theme").querySelectorAll("button").forEach(button => {
    button.classList.toggle("on", button.dataset.pick === themePref);
  });
}

$("theme").onclick = event => {
  const pick = event.target.dataset && event.target.dataset.pick;
  if (!pick) return;
  themePref = pick;
  try { localStorage.setItem(THEME_KEY, pick); } catch (_) {}
  applyTheme();
};

systemDark.addEventListener("change", () => { if (themePref === "system") applyTheme(); });
applyTheme();

// ----------------------------------------------------------------------
// Resizable layout. Each divider drags, side panels snap closed when
// dragged small, double-click restores the default, and the result is
// remembered across reloads.
// ----------------------------------------------------------------------
const rootStyle = document.documentElement.style;
const LAYOUT_KEY = "qlikai-layout";
let layout = {};
try { layout = JSON.parse(localStorage.getItem(LAYOUT_KEY)) || {}; } catch (_) {}

function applyLayout() {
  const set = (prop, value) =>
    value != null ? rootStyle.setProperty(prop, value + "px")
                  : rootStyle.removeProperty(prop);
  set("--sections-w", layout.sections);
  set("--connections-w", layout.connections);
  set("--chat-h", layout.chat);
}
applyLayout();

function saveLayout() {
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch (_) {}
}

// Below this a panel is unreadable anyway, so it snaps shut instead of
// lingering as a sliver. Drag it back out (or double-click) to reopen.
const snapPanel = value => value < 60 ? 0 : Math.min(Math.max(value, 120), 480);

function draggable(handle, key, compute) {
  handle.addEventListener("pointerdown", event => {
    event.preventDefault();
    handle.setPointerCapture(event.pointerId);
    handle.classList.add("dragging");
    const move = ev => { layout[key] = compute(ev); applyLayout(); };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", () => {
      handle.removeEventListener("pointermove", move);
      handle.classList.remove("dragging");
      saveLayout();
    }, {once: true});
  });
  handle.addEventListener("dblclick", () => {
    delete layout[key];
    applyLayout();
    saveLayout();
  });
}

draggable($("dragSections"), "sections", ev => snapPanel(ev.clientX));
draggable($("dragConnections"), "connections",
          ev => snapPanel(window.innerWidth - ev.clientX));
draggable($("dragChat"), "chat", ev => Math.min(
  Math.max(window.innerHeight - ev.clientY, 110),
  Math.round(window.innerHeight * 0.92)
));

LANGUAGES.forEach(([code, name]) => {
  const option = document.createElement("option");
  option.value = code;
  option.textContent = name;
  $("langSel").appendChild(option);
});
$("langSel").value = lang;

$("langSel").onchange = event => {
  lang = event.target.value;
  try { localStorage.setItem("qlik-ai-lang", lang); } catch (_) {}
  applyLanguage();
  pinLanguage();
  // load() repaints the parts built from templates - chips, the hint, the
  // placeholder, the history list - which applyLanguage() cannot reach.
  load().catch(e => setStatus(t("couldNotReachQlik", {error: e.message}), "bad"));
};

// The assistant answers in whatever the question was written in unless it is
// told otherwise; this is the telling. Failing to reach the server costs the
// assistant's language, not the interface's, so it is not fatal.
function pinLanguage() {
  api("/api/select", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({language: lang}),
  }).catch(e => console.warn("Could not pin the assistant's language:", e));
}

applyLanguage();
pinLanguage();
load().catch(e => setStatus(t("couldNotReachQlik", {error: e.message}), "bad"));
</script>
