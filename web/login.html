<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qlik AI — Sign in</title>
<script>

  try {
    var saved = localStorage.getItem("qlikai-theme") || "system";
    document.documentElement.dataset.theme =
      saved === "dark" || (saved !== "light" &&
        matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  } catch (e) {}
</script>
<style>

  :root {
    color-scheme: light;
    --green: #00934c; --green-dark: #007a3f; --green-soft: #e6f5ec;
    --bg: #f4f6f8; --surface: #ffffff; --raised: #fbfcfd;
    --line: #e2e6ea; --line-soft: #edf0f3;
    --ink: #1f2733; --muted: #69737f; --faint: #97a0aa;
    --accent: #2f7fb2; --accent-soft: #e9f3f9;
    --bad: #c0392b; --bad-soft: #fcedeb;
    --chip: #f0f2f5;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
    --lift: 0 10px 30px rgba(16, 24, 40, .08), 0 2px 8px rgba(16, 24, 40, .05);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --green: #1db26b; --green-dark: #17995b; --green-soft: #10281c;
    --bg: #14161a; --surface: #1c1f24; --raised: #22262c;
    --line: #30353d; --line-soft: #272b32;
    --ink: #e6e9ed; --muted: #e8e0e0; --faint: #6b747f;
    --accent: #5aa3cf; --accent-soft: #16232c;
    --bad: #cc0808; --bad-soft: #33201c;
    --chip: #262b32;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --lift: 0 10px 34px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--ink); background: var(--bg);
    display: grid; place-items: center; padding: 24px;
  }
  ::selection { background: var(--accent); color: #fff; }

  .card {
    width: 100%; max-width: 380px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--lift);
    padding: 30px 30px 26px;
  }

  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand .mark {
    width: 32px; height: 32px; border-radius: 9px; flex: none;
    background: linear-gradient(135deg, var(--green) 0%, #06b6d4 120%);
    display: grid; place-items: center;
    color: #fff; font-size: 15px; font-weight: 700;
  }
  .brand .name { font-weight: 650; font-size: 16px; letter-spacing: .1px; }
  .brand .name span { color: var(--green); }

  h1 { font-size: 17px; font-weight: 650; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 20px; }

  label { display: block; margin-bottom: 13px; }
  label .caption {
    display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .4px;
    text-transform: uppercase; color: var(--faint); margin-bottom: 4px;
  }
  input[type="text"], input[type="password"] {
    width: 100%; font: 14px "Segoe UI", system-ui, sans-serif;
    color: var(--ink); background: var(--raised);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; outline: none; transition: border-color .15s;
  }
  input:hover { border-color: var(--faint); }
  input:focus { border-color: var(--accent); }

  button {
    width: 100%; margin-top: 6px;
    font: 600 14px "Segoe UI", system-ui, sans-serif; color: #fff;
    background: var(--green); border: 1px solid var(--green-dark);
    border-radius: 8px; padding: 10px; cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  button:hover:not(:disabled) { background: var(--green-dark); }
  button:disabled { opacity: .6; cursor: default; }

  .note {
    margin-top: 16px; padding: 10px 12px; border-radius: 8px;
    font-size: 12.5px; display: none;
  }
  .note.bad { display: block; background: var(--bad-soft); color: var(--bad);
              border: 1px solid var(--bad); }
  .note.info { display: block; background: var(--accent-soft);
               color: var(--accent); border: 1px solid var(--accent); }

  .foot {
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; font-size: 11.5px; color: var(--faint);
  }
  .langs { display: flex; gap: 4px; }
  .langs button {
    width: auto; margin: 0; padding: 3px 8px; font-size: 11.5px; font-weight: 600;
    color: var(--muted); background: var(--chip); border: 1px solid var(--line);
    border-radius: 6px;
  }
  .langs button[aria-pressed="true"] {
    color: #fff; background: var(--green); border-color: var(--green-dark);
  }
</style>
</head>
<body>

<form class="card" id="form" autocomplete="on">
  <div class="brand">
    <div class="mark">Q</div>
    <div class="name">Qlik <span>AI</span></div>
  </div>

  <h1 data-i18n="title">Sign in</h1>
  <p class="sub" data-i18n="subtitle">Your conversations, your apps and your
    Qlik permissions are your own.</p>

  <label>
    <span class="caption" data-i18n="username">Username</span>
    <input type="text" id="username" name="username" autocomplete="username"
           autocapitalize="none" spellcheck="false" required autofocus>
  </label>

  <label>
    <span class="caption" data-i18n="password">Password</span>
    <input type="password" id="password" name="password"
           autocomplete="current-password" required>
  </label>

  <button type="submit" id="submit" data-i18n="signIn">Sign in</button>

  <div class="note" id="note" role="status" aria-live="polite"></div>

  <div class="foot">
    <span data-i18n="local">Runs entirely on your machine</span>
    <span class="langs" id="langs"></span>
  </div>
</form>

<script>
const $ = id => document.getElementById(id);

const LANGUAGES = [["en", "English"], ["ru", "Русский"], ["uz", "O'zbekcha"]];

const STRINGS = {
  en: {
    title: "Sign in",
    subtitle: "Your conversations, your apps and your Qlik permissions are your own.",
    username: "Username", password: "Password", signIn: "Sign in",
    signingIn: "Signing in…",
    local: "Runs entirely on your machine",
    wrong: "That username and password do not match.",
    locked: "Too many failed attempts. This account is locked for a few minutes.",
    unreachable: "Could not reach the server. Is it still running?",
  },
  ru: {
    title: "Вход",
    subtitle: "Ваши диалоги, ваши приложения и ваши права в Qlik — только ваши.",
    username: "Имя пользователя", password: "Пароль", signIn: "Войти",
    signingIn: "Входим…",
    local: "Работает полностью на вашем компьютере",
    wrong: "Имя пользователя и пароль не совпадают.",
    locked: "Слишком много неудачных попыток. Учётная запись заблокирована на несколько минут.",
    unreachable: "Не удалось связаться с сервером. Он ещё запущен?",
  },
  uz: {
    title: "Kirish",
    subtitle: "Suhbatlaringiz, ilovalaringiz va Qlik huquqlaringiz — faqat sizniki.",
    username: "Foydalanuvchi nomi", password: "Parol", signIn: "Kirish",
    signingIn: "Kirilmoqda…",
    local: "To'liq sizning kompyuteringizda ishlaydi",
    wrong: "Foydalanuvchi nomi va parol mos kelmadi.",
    locked: "Juda ko'p muvaffaqiyatsiz urinish. Hisob bir necha daqiqaga bloklandi.",
    unreachable: "Server bilan bog'lanib bo'lmadi. U hali ishlayaptimi?",
  },
};

let lang = pickLanguage();

function pickLanguage() {
  try {
    const saved = localStorage.getItem("qlikai-lang");
    if (saved && STRINGS[saved]) return saved;
  } catch (e) {}
  const guess = (navigator.language || "en").slice(0, 2).toLowerCase();
  return STRINGS[guess] ? guess : "en";
}

const t = key => (STRINGS[lang] || STRINGS.en)[key] || STRINGS.en[key] || key;

function applyLanguage() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(
    el => el.textContent = t(el.dataset.i18n));
  renderLanguages();
}

function renderLanguages() {
  const box = $("langs");
  box.textContent = "";
  for (const [code, label] of LANGUAGES) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = code.toUpperCase();
    button.title = label;
    button.setAttribute("aria-pressed", String(code === lang));
    button.onclick = () => {
      lang = code;
      try { localStorage.setItem("qlikai-lang", code); } catch (e) {}
      applyLanguage();
    };
    box.appendChild(button);
  }
}

function say(message, kind) {
  const note = $("note");
  note.textContent = message || "";
  note.className = message ? "note " + (kind || "bad") : "note";
}

$("form").addEventListener("submit", async event => {
  event.preventDefault();
  say("");
  $("submit").disabled = true;
  $("submit").textContent = t("signingIn");

  try {
    const response = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: $("username").value.trim(),
        password: $("password").value,
      }),
    });

    if (response.ok) {

      window.location.replace("/");
      return;
    }

    let detail = "";
    try { detail = (await response.json()).detail || ""; } catch (e) {}
    say(detail || (response.status === 429 ? t("locked") : t("wrong")));
  } catch (e) {
    say(t("unreachable"));
  } finally {
    $("submit").disabled = false;
    $("submit").textContent = t("signIn");
    $("password").select();
  }
});

applyLanguage();
</script>
</body>
</html>
